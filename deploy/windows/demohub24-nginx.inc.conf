# Include inside the existing nginx http {} block after review.
server {
    listen 127.0.0.1:8080;
    server_name mfecbank.demohub24.com;
    root C:/DemoHub24/www/mfecbank;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apps.apse1.pure.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.apse1.pure.cloud; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.apse1.pure.cloud; font-src 'self' data: https://fonts.gstatic.com https://*.apse1.pure.cloud; img-src 'self' data: blob: https://*.apse1.pure.cloud; connect-src 'self' https://*.apse1.pure.cloud wss://*.apse1.pure.cloud; frame-src https://*.apse1.pure.cloud; frame-ancestors 'none'" always;
    location /retail/ { proxy_pass http://127.0.0.1:4100/retail/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8080;
    server_name ibank.demohub24.com;
    root C:/DemoHub24/www/ibank;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apps.apse1.pure.cloud; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.apse1.pure.cloud; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.apse1.pure.cloud; font-src 'self' data: https://fonts.gstatic.com https://*.apse1.pure.cloud; img-src 'self' data: blob: https://*.apse1.pure.cloud; connect-src 'self' https://*.apse1.pure.cloud wss://*.apse1.pure.cloud; frame-src https://*.apse1.pure.cloud; frame-ancestors 'none'" always;
    location /retail/ { proxy_pass http://127.0.0.1:4100/retail/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8080;
    server_name backend.demohub24.com;
    root C:/DemoHub24/www/backend;
    index index.html;
    auth_request /__sso_verify;
    error_page 401 = @sso_login;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /__sso_verify { internal; proxy_pass http://127.0.0.1:4100/auth/verify; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Cookie $http_cookie; }
    location @sso_login { return 302 https://backend.demohub24.com/login?return=https://$host$request_uri; }
    location = /login { auth_request off; try_files /index.html =404; }
    location /assets/ { auth_request off; try_files $uri =404; }
    location /auth/ { auth_request off; proxy_pass http://127.0.0.1:4100/auth/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /api/ { auth_request off; proxy_pass http://127.0.0.1:4100/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /legacy/ { proxy_pass http://127.0.0.1:4100/legacy/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location = /docs { auth_request off; proxy_pass http://127.0.0.1:4100/docs; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /docs/ { auth_request off; proxy_pass http://127.0.0.1:4100/docs/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location = /openapi.json { auth_request off; proxy_pass http://127.0.0.1:4100/openapi.json; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8080;
    server_name ~^(?<legacy_app>portal|cif|core|card|loan|collection|mobile|payment|wealth|fraud|kyc|campaign|notify|admin)\.demohub24\.com$;
    return 301 https://backend.demohub24.com/$legacy_app$request_uri;
}
server {
    listen 127.0.0.1:8080;
    server_name api.demohub24.com;
    return 301 https://backend.demohub24.com$request_uri;
}
