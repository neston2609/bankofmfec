# Portable Linux origin example matching the production domain structure.
server { listen 80; server_name mfecbank.demohub24.com; root /var/www/demohub24/mfecbank; index index.html; location /retail/ { proxy_pass http://127.0.0.1:4100/retail/; } location / { try_files $uri $uri/ /index.html; } }
server { listen 80; server_name ibank.demohub24.com; root /var/www/demohub24/ibank; index index.html; location /retail/ { proxy_pass http://127.0.0.1:4100/retail/; } location / { try_files $uri $uri/ /index.html; } }
server { listen 80; server_name backend.demohub24.com; root /var/www/demohub24/backend; index index.html; location /api/ { proxy_pass http://127.0.0.1:4100/api/; } location /legacy/ { proxy_pass http://127.0.0.1:4100/legacy/; } location /auth/ { proxy_pass http://127.0.0.1:4100/auth/; } location = /docs { proxy_pass http://127.0.0.1:4100/docs; } location /docs/ { proxy_pass http://127.0.0.1:4100/docs/; } location = /openapi.json { proxy_pass http://127.0.0.1:4100/openapi.json; } location / { try_files $uri $uri/ /index.html; } }
